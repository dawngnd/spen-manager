<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Spen Manager - Quản lý chi tiêu cá nhân qua Telegram Mini App" />
    <meta name="theme-color" content="#000000" />
    <title>Spen Manager</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      console.log("[RAW] href: " + window.location.href);
      console.log("[RAW] hash: " + window.location.hash);
      console.log("[RAW] search: " + window.location.search);
      if (window.Telegram && window.Telegram.WebApp) {
        console.log("[RAW] Telegram WebApp initData length: " + window.Telegram.WebApp.initData.length);
      } else {
        console.log("[RAW] window.Telegram.WebApp is missing");
      }
    </script>
    <!-- SPA redirect handler for GitHub Pages 404.html -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <style>
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #888;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #app-loader { background: #1a1a2e; color: #aaa; }
      }
      #app-loader .spinner {
        width: 32px; height: 32px;
        border: 3px solid #e0e0e0;
        border-top-color: #3390ec;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/spen-manager/assets/index-QmkGCG2h.js"></script>
    <link rel="stylesheet" crossorigin href="/spen-manager/assets/index-C4Em4c8b.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <span>Loading Spen Manager...</span>
      </div>
    </div>
  </body>
</html>
